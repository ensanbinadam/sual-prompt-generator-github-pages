name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: إعداد Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: تثبيت المكتبات
        run: npm ci
      - name: بناء نسخة GitHub Pages
        run: npm run build:pages
      - name: إعداد GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: تجهيز حزمة الموقع
        run: tar --dereference --hard-dereference --directory dist-pages -cvf "${{ runner.temp }}/artifact.tar" --exclude=.git --exclude=.github .
      - name: رفع ملفات الموقع
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
